name: hamid

services:
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-hamid}
      MYSQL_USER: ${MYSQL_USER:-hamid}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "127.0.0.1:3306:3306" # bind to localhost only; POS/ERP on the same host or VPN can still reach it
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio-data:/data
    ports:
      - "127.0.0.1:9001:9001" # admin console — tunnel or VPN in, don't expose publicly
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    entrypoint: >
      sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb -p local/hamid-public &&
      mc mb -p local/hamid-private &&
      mc anonymous set download local/hamid-public &&
      echo 'MinIO buckets ready.'
      "

  web:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: runner
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - ../.env
    ports:
      - "127.0.0.1:3000:3000" # only nginx talks to this directly

  migrator:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      target: migrator
    depends_on:
      mysql:
        condition: service_healthy
    env_file:
      - ../.env
    profiles: ["tools"] # run on demand: docker compose run --rm migrator

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - web
      - minio
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
      # - "443:443" # add once TLS certs are provisioned — see docs/SETUP.md

volumes:
  mysql-data:
  minio-data:
