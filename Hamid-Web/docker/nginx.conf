server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Public product/menu/media images stored in the "hamid-public" MinIO bucket.
    # The app builds media URLs as https://<domain>/media/<objectKey> for public
    # files (see apps/web S3_PUBLIC_ENDPOINT). Presigned uploads to the private
    # bucket also route through here so the browser never talks to MinIO directly.
    location /media/ {
        rewrite ^/media/(.*)$ /hamid-public/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # S3 API passthrough — required so presigned PUT/GET URLs generated by the
    # app (pointing at S3_PUBLIC_ENDPOINT=https://<domain>/s3) actually reach MinIO.
    location /s3/ {
        rewrite ^/s3/(.*)$ /$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
    }

    location / {
        proxy_pass http://web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# Once you have a domain + TLS certs (see docs/SETUP.md for certbot steps),
# add a second server block on 443 with ssl_certificate directives and change
# the block above to redirect http -> https.
